from gvtest.testsuite import *


def testset_build(testset):
    testset.set_name('router_beat')
    testset.set_components(["interco.router_v2.beat"])

    t = testset.new_make_test('single_beat', flags='CASE=single_beat', build_resource='gvsoc.core.build', no_clean=True)
    t.add_description(
        "A single 4-byte read at cycle 10 to one target. Smoke test for "
        "the basic decode-and-forward path: master SEND, router GRANTED, "
        "fsm wakes one cycle later, target completes inline, master sees "
        "RESP — verifies the happy single-master / single-output path."
    )

    t = testset.new_make_test('burst4', flags='CASE=burst4', build_resource='gvsoc.core.build', no_clean=True)
    t.add_description(
        "A 4-beat burst (16 bytes at width=4) from one master to one "
        "target. Verifies that the burst-table slot survives across "
        "is_first..is_last, that the per-burst burst_id remap is stable "
        "across the round trip, and that max_input_pending_size=64 "
        "absorbs all in-flight beats without back-pressure."
    )

    t = testset.new_make_test('two_masters_contend', flags='CASE=two_masters_contend', build_resource='gvsoc.core.build', no_clean=True)
    t.add_description(
        "Two masters start a 4-beat burst on the same cycle to the same "
        "target. Verifies round-robin arbitration *between* bursts (a "
        "starting input keeps the output until is_last) and burst "
        "atomicity *within* a burst (no interleaving of the two streams' "
        "beats on the output channel)."
    )

    t = testset.new_make_test('size_over_width', flags='CASE=size_over_width', build_resource='gvsoc.core.build', no_clean=True)
    t.add_description(
        "A single 8-byte beat on a router with width=4. Exercises the "
        "'beat too large' guard in req_muxed — the router immediately "
        "responds IO_RESP_INVALID and increments the ``errors`` stat "
        "without forwarding."
    )

    t = testset.new_make_test('resp_arbitration', flags='CASE=resp_arbitration',
                              checker=_check_resp_arbitration,
                              build_resource='gvsoc.core.build', no_clean=True)
    t.add_description(
        "One master issues two multi-beat reads to two different outputs. "
        "Both output adapters stream their 4 response beats back at one "
        "beat/cycle, so the two streams overlap on the single input's "
        "response channel. Asserts the master never sees more than one RESP "
        "beat in a cycle — proving the router's per-input response arbiter "
        "caps the input's response channel at one beat/cycle. Without it the "
        "two streams collide and the master sees two RESP beats in the same "
        "cycle."
    )

    t = testset.new_make_test('deny_mid_burst', flags='CASE=deny_mid_burst', build_resource='gvsoc.core.build', no_clean=True)
    t.add_description(
        "Target denies the first 2 beats of a 4-beat burst "
        "(deny_then_done, deny_count=2, retry_delay=3) then accepts. "
        "Verifies that the output's ``stalled`` flag is set on each "
        "IO_REQ_DENIED, that the FIFO holds the head beat across the "
        "stall, and that retry_muxed resumes forwarding from the same "
        "head."
    )

    t = testset.new_make_test('granted_resp_delay', flags='CASE=granted_resp_delay', build_resource='gvsoc.core.build', no_clean=True)
    t.add_description(
        "Target answers IO_REQ_GRANTED with a 5-cycle resp_delay. "
        "Verifies the deferred-response path: the router stays out of "
        "the way, the master sees GRANTED, and the target's late resp() "
        "reaches the master via resp_muxed."
    )

    t = testset.new_make_test('deny_then_granted', flags='CASE=deny_then_granted', build_resource='gvsoc.core.build', no_clean=True)
    t.add_description(
        "Target denies the first beat twice then accepts subsequent "
        "attempts with IO_REQ_GRANTED + resp_delay=5. Exercises the full "
        "DENY → retry → re-forward → GRANTED → deferred-resp chain in a "
        "single test."
    )

    t = testset.new_make_test('write_pipelined_lock', flags='CASE=write_pipelined_lock',
                              checker=_check_write_pipelined_lock,
                              build_resource='gvsoc.core.build', no_clean=True)
    t.add_description(
        "One input streams two write bursts back to back to a native target "
        "that acks each burst 12 cycles after its last beat, so the first "
        "burst's ack lands while the second is still streaming; a second "
        "input's single-beat write to the same output is queued meanwhile. "
        "Asserts the target never sees a write burst open while another is "
        "still accepting beats: the first ack must not release the output "
        "lock the second burst holds (the lock belongs to a burst, not just "
        "to an input)."
    )

    t = testset.new_make_test('output_max_pending', flags='CASE=output_max_pending',
                              checker=_check_output_max_pending,
                              build_resource='gvsoc.core.build', no_clean=True)
    t.add_description(
        "Mapping max_pending_bursts=1: three single-beat reads from two masters, "
        "each answered 10 cycles after its forward, reach the target one at a "
        "time, the next one only once the previous transaction completed.")

    t = testset.new_make_test('read_no_lock', flags='CASE=read_no_lock',
                              checker=_check_read_no_lock,
                              build_resource='gvsoc.core.build', no_clean=True)
    t.add_description(
        "A single-request read does not lock the output: a second master's read "
        "to the same target is forwarded the cycle after the first one's, while "
        "the first response is still 10 cycles away.")

    t = testset.new_make_test('fifo_overflow', flags='CASE=fifo_overflow', build_resource='gvsoc.core.build', no_clean=True)
    t.add_description(
        "Target denies the first beat once with retry_delay=10, so the "
        "output stalls and beats queue in the router FIFO. With "
        "max_input_pending_size=8 (2 beats of size 4) and a 4-beat "
        "burst, the 3rd and 4th beats are denied *upstream* (the router "
        "runs out of FIFO space). Verifies that ``denied_upstream`` "
        "triggers retry() to the master once the FIFO drains."
    )

    t = testset.new_make_test('cascade_single', flags='CASE=cascade_single', build_resource='gvsoc.core.build', no_clean=True)
    t.add_description(
        "Two routers in series — master → router_a → router_b → target — "
        "with a single beat. Verifies the chained mapping decode and "
        "that each router adds one cycle of latency (one fsm tick per "
        "router)."
    )

    t = testset.new_make_test('cascade_burst4', flags='CASE=cascade_burst4', build_resource='gvsoc.core.build', no_clean=True)
    t.add_description(
        "A 4-beat burst through the same cascade. Verifies that beats "
        "pipeline across both routers: the Nth beat reaches the target "
        "at master_send_cycle + 2, with steady-state throughput of one "
        "beat per cycle."
    )

    t = testset.new_make_test('cascade_deny', flags='CASE=cascade_deny', build_resource='gvsoc.core.build', no_clean=True)
    t.add_description(
        "Target denies the first beat of a 2-beat burst once then "
        "accepts. Verifies that the burst-id remap chain survives a "
        "deny across two routers (slot-id remap in router_b is reverted "
        "on deny, then re-applied on the re-forward)."
    )

    t = testset.new_make_test('cascade4_asymmetric_read',
                              flags='CASE=cascade4_asymmetric_read',
                              build_resource='gvsoc.core.build',
                              no_clean=True)
    t.add_description(
        "Master submits a single read req with size much larger than the "
        "per-router width (4 KiB vs width=8), mimicking the v2 iDMA's "
        "asymmetric read shape, through four cascaded KIND_BEAT routers. "
        "Each router's output adapter chunks the downstream's DONE into "
        "N beats; the previous router's adapter must absorb that stream "
        "and re-chunk on its own output. Regression for a multi-stage "
        "iDMA-through-cascaded-beat-routers hang."
    )

    t = testset.new_make_test('cascade4_multibeat_write',
                              flags='CASE=cascade4_multibeat_write',
                              build_resource='gvsoc.core.build',
                              no_clean=True)
    t.add_description(
        "Beat-form multi-beat write (8 × 8 B) through the same 4-deep "
        "BEAT cascade. Matches the iDMA's write-side shape and "
        "stresses active_multi_beat_slot tracking through cascaded "
        "routers."
    )

    t = testset.new_make_test('cascade4_rw_concurrent',
                              flags='CASE=cascade4_rw_concurrent',
                              build_resource='gvsoc.core.build',
                              no_clean=True)
    t.add_description(
        "Asymmetric 4 KiB read on one input + 512 × 8 B beat-form write "
        "on another, both through the same 4-deep cascade and targeting "
        "the same final stub_target. Mirrors the iDMA's read + write "
        "sharing the same chip fabric."
    )

    t = testset.new_make_test('shared_rw_channel_split',
                              flags='CASE=shared_rw_channel_split',
                              checker=_check_shared_rw_channel_split,
                              build_resource='gvsoc.core.build',
                              no_clean=True)
    t.add_description(
        "Two single-beat bursts to the same output on the same cycle — "
        "one read (master_a), one write (master_b) — with "
        "shared_rw_channel=False. Asserts that both RESP lines land on "
        "the same cycle, proving the read and write channels are "
        "independent on the shared output."
    )

    t = testset.new_make_test('shared_rw_channel_shared',
                              flags='CASE=shared_rw_channel_shared',
                              checker=_check_shared_rw_channel_shared,
                              build_resource='gvsoc.core.build',
                              no_clean=True)
    t.add_description(
        "Same scenario as ``shared_rw_channel_split`` but with "
        "shared_rw_channel=True. Asserts that the two RESP cycles are "
        "exactly one cycle apart, proving R and W serialise through the "
        "single shared slot."
    )

    t = testset.new_make_test('shared_rw_channel_bandwidth_split',
                              flags='CASE=shared_rw_channel_bandwidth_split',
                              checker=_check_shared_rw_channel_bandwidth_split,
                              build_resource='gvsoc.core.build',
                              no_clean=True)
    t.add_description(
        "Sustained-throughput proof. Two 8-beat bursts (one R, one W) "
        "start on the same cycle on the same output with "
        "shared_rw_channel=False. Asserts the 16 beats complete in 8 "
        "cycles (2.0 beats/cycle) and that beat #i lands on the same "
        "cycle for R and W — the channels run in lockstep."
    )

    t = testset.new_make_test('shared_rw_channel_bandwidth_shared',
                              flags='CASE=shared_rw_channel_bandwidth_shared',
                              checker=_check_shared_rw_channel_bandwidth_shared,
                              build_resource='gvsoc.core.build',
                              no_clean=True)
    t.add_description(
        "Same workload as the split case but with "
        "shared_rw_channel=True. Asserts the 16 beats complete in 16 "
        "cycles (1.0 beat/cycle) — half the throughput, since burst "
        "atomicity makes the second burst wait for the first to release "
        "the shared channel."
    )

    t = testset.new_make_test('rw_channel_stall_independent',
                              flags='CASE=rw_channel_stall_independent',
                              checker=_check_rw_channel_stall_independent,
                              build_resource='gvsoc.core.build',
                              no_clean=True)
    t.add_description(
        "Per-channel back-pressure. A write to an output is denied and held "
        "stalled for a long retry; a read to the SAME output arrives while "
        "that stall is active. Asserts the read completes well before the "
        "write's retry resolves — proving the stall is per (output, channel), "
        "so a back-pressured write does not block reads to the same output. "
        "A per-output stall would make the read finish alongside the write."
    )

    t = testset.new_make_test('write_inline_ack_native',
                              flags='CASE=write_inline_ack_native',
                              checker=_check_single_write_ack,
                              build_resource='gvsoc.core.build',
                              no_clean=True)
    t.add_description(
        "Native IoV2Beat target bound raw (no adapter). 4-beat write burst; "
        "the target consumes and frees non-last beats and answers the last "
        "beat with an inline DONE. The router must recycle the beat it owns "
        "into the burst ack and deliver it through its response FSM "
        "(synthesized-ack path). Asserts exactly one write RESP."
    )

    t = testset.new_make_test('write_granted_ack_native',
                              flags='CASE=write_granted_ack_native',
                              checker=_check_single_write_ack,
                              build_resource='gvsoc.core.build',
                              no_clean=True)
    t.add_description(
        "Same shape but the native target GRANTs the last beat too and "
        "produces the data-less burst ack itself after resp_delay cycles — "
        "exercising the router's write-ack handling in resp_muxed. Asserts "
        "exactly one write RESP."
    )


def _target_req_cycles(output, target='t0'):
    import re
    return [int(m.group(1)) for m in
            re.finditer(r'^\[(\d+)\] ' + target + r' REQ ', output, re.M)]


def _check_output_max_pending(test, output, *args, **kwargs):
    """Assert the target sees one transaction at a time (mapping limit 1)."""
    cycles = _target_req_cycles(output)
    if len(cycles) != 3:
        return False, f'Expected 3 target requests, got {len(cycles)}'
    gaps = [b - a for a, b in zip(cycles, cycles[1:])]
    if min(gaps) < 10:
        return False, (f'Requests forwarded {gaps} cycles apart at {cycles}; the '
                       f'output must wait for the previous transaction (10 cycles)')
    return True, f'target requests at {cycles}, one transaction at a time'


def _check_read_no_lock(test, output, *args, **kwargs):
    """Assert a pending read does not hold the output for a second master."""
    cycles = _target_req_cycles(output)
    if len(cycles) != 2:
        return False, f'Expected 2 target requests, got {len(cycles)}'
    if cycles[1] - cycles[0] > 2:
        return False, (f'Second read forwarded {cycles[1] - cycles[0]} cycles after the '
                       f'first (at {cycles}): the output was locked by a pending read')
    return True, f'target requests at {cycles}, no read lock'


def _check_write_pipelined_lock(test, output, *args, **kwargs):
    """Assert the target's write beats never interleave two bursts.

    Walks the target's REQ log: a write beat with first=1 while a previous
    write burst has not yet shown its last=1 beat means the router let another
    burst onto the output channel mid-burst.
    """
    import re
    open_burst = None
    nb_bursts = 0
    for line in output.splitlines():
        m = re.search(r'^\[(\d+)\] t0 REQ addr=0x[0-9a-f]+ size=\d+ write=1 '
                      r'burst_id=(-?\d+) first=(\d) last=(\d)', line)
        if not m:
            continue
        cycle, burst_id, first, last = int(m.group(1)), m.group(2), m.group(3), m.group(4)
        if first == '1':
            if open_burst is not None:
                return False, (f'Write burst {burst_id} opened at cycle {cycle} while '
                               f'burst {open_burst} was still accepting beats')
            open_burst = burst_id
            nb_bursts += 1
        elif open_burst is None or open_burst != burst_id:
            return False, (f'Beat of burst {burst_id} at cycle {cycle} outside its '
                           f'burst (open burst: {open_burst})')
        if last == '1':
            open_burst = None
    if nb_bursts != 3:
        return False, f'Expected 3 write bursts at the target, got {nb_bursts}'
    return True, 'three write bursts delivered without interleaving'


def _check_resp_arbitration(test, output, *args, **kwargs):
    """Assert the single master never sees more than one RESP beat per cycle.

    Two multi-beat reads to two outputs stream their responses back on the same
    input's response channel. The router's per-input response arbiter caps it at
    one beat/cycle; without it the two streams collide and the master sees two
    RESP beats in the same cycle.
    """
    import re
    from collections import Counter
    per_cycle: Counter = Counter()
    beats: dict[str, int] = {'A': 0, 'B': 0}
    for line in output.splitlines():
        m = re.search(r'^\[(\d+)\] master RESP name=([AB])#\d+ .*status=0', line)
        if m:
            per_cycle[int(m.group(1))] += 1
            beats[m.group(2)] += 1
    if not per_cycle:
        return False, 'No RESP beats found in master log'
    worst = max(per_cycle.values())
    if worst > 1:
        clashes = sorted(c for c, n in per_cycle.items() if n > 1)
        return False, (f'Master saw {worst} response beats in one cycle '
                       f'(cycles {clashes}) — per-input response arbiter not '
                       f'limiting to 1 beat/cycle/input')
    if beats['A'] != 4 or beats['B'] != 4:
        return False, (f'Expected 4 response beats each for A and B; got {beats}')
    span = max(per_cycle) - min(per_cycle) + 1
    return True, (f'8 beats delivered at most 1/cycle (peak {worst}/cycle over '
                  f'{len(per_cycle)} cycles, span {span})')


def _resp_cycles(output: str) -> dict[str, int]:
    """Extract one ``RESP`` cycle per burst name from a stub_master log."""
    import re
    cycles: dict[str, int] = {}
    for line in output.splitlines():
        m = re.search(r'^\[(\d+)\] master_[ab] RESP name=([RW])#\d+ .*status=0', line)
        if m and m.group(2) not in cycles:
            cycles[m.group(2)] = int(m.group(1))
    return cycles


def _check_shared_rw_channel_split(test, output, *args, **kwargs):
    cycles = _resp_cycles(output)
    if 'R' not in cycles or 'W' not in cycles:
        return False, f'Missing RESP for R or W (got {cycles})'
    if cycles['R'] != cycles['W']:
        return False, (f'Expected R and W to complete on the same cycle with '
                       f'separate channels; got R={cycles["R"]} W={cycles["W"]}')
    return True, f'R and W both completed at cycle {cycles["R"]}'


def _check_shared_rw_channel_shared(test, output, *args, **kwargs):
    cycles = _resp_cycles(output)
    if 'R' not in cycles or 'W' not in cycles:
        return False, f'Missing RESP for R or W (got {cycles})'
    diff = abs(cycles['R'] - cycles['W'])
    if diff != 1:
        return False, (f'Expected R and W to complete one cycle apart with a '
                       f'shared channel; got R={cycles["R"]} W={cycles["W"]} '
                       f'(diff={diff})')
    return True, f'R and W serialised: R={cycles["R"]} W={cycles["W"]}'


def _check_rw_channel_stall_independent(test, output, *args, **kwargs):
    cycles = _resp_cycles(output)
    if 'R' not in cycles or 'W' not in cycles:
        return False, f'Missing RESP for R or W (got {cycles})'
    # The write is denied and held stalled for a 20-cycle retry; the read to
    # the same output arrives while that stall is active. With per-channel
    # stall the read completes long before the write's retry resolves; with a
    # per-output stall it would be blocked behind the write and finish with it.
    if cycles['R'] >= cycles['W']:
        return False, (f'Read did not complete before the stalled write — '
                       f'per-channel stall not effective (R={cycles["R"]} '
                       f'W={cycles["W"]})')
    if cycles['W'] - cycles['R'] < 8:
        return False, (f'Read finished too close to the write retry '
                       f'(R={cycles["R"]} W={cycles["W"]}); expected it to '
                       f'complete while the write channel was still stalled')
    return True, (f'read completed at {cycles["R"]} while the write stayed '
                  f'stalled until {cycles["W"]} — channels independent')


def _all_resp_cycles(output: str) -> dict[str, list[int]]:
    """Group every successful ``RESP`` cycle by burst name."""
    import re
    cycles: dict[str, list[int]] = {'R': [], 'W': []}
    for line in output.splitlines():
        m = re.search(r'^\[(\d+)\] master_[ab] RESP name=([RW])#\d+ .*status=0', line)
        if m:
            cycles[m.group(2)].append(int(m.group(1)))
    return cycles


# Number of beats per burst in shared_rw_channel_bandwidth_{split,shared}.
# Must match build_case() in test.py.
_BW_NB_BEATS = 8


def _check_shared_rw_channel_bandwidth_split(test, output, *args, **kwargs):
    cycles = _all_resp_cycles(output)
    nb = _BW_NB_BEATS
    # Reads keep one RESP per beat; the write burst now completes with a
    # single ack (per-burst write acknowledgement). The channels still run in
    # lockstep on the forward side, so the ack must land on the same cycle as
    # the old 8th write ack did — i.e. the read stream's last beat cycle.
    if len(cycles['R']) != nb:
        return False, (f'Expected {nb} read beats; got {len(cycles["R"])}')
    if len(cycles['W']) != 1:
        return False, (f'Expected a single write burst ack; got '
                       f'{len(cycles["W"])} ({cycles["W"]})')
    span = cycles['R'][-1] - cycles['R'][0] + 1
    if span != nb:
        return False, (f'Expected {nb}-cycle pipelined read burst; got {span} '
                       f'cycles ({cycles["R"][0]}..{cycles["R"][-1]})')
    if cycles['W'][0] != cycles['R'][-1]:
        return False, (f'Write ack expected on the read stream\'s last cycle '
                       f'{cycles["R"][-1]} (lockstep channels); got '
                       f'{cycles["W"][0]}')
    return True, (f'{nb} read beats over {span} cycles + write ack at '
                  f'{cycles["W"][0]} (2x channel split confirmed)')


def _check_shared_rw_channel_bandwidth_shared(test, output, *args, **kwargs):
    cycles = _all_resp_cycles(output)
    nb = _BW_NB_BEATS
    # The write burst completes with a single ack under the per-burst write
    # acknowledgement; the serialisation proof moves to the READ stream: with
    # burst atomicity the elected burst monopolises the shared channel until
    # it completes, so the two bursts do not overlap. The write ack must land
    # exactly where the old 8th write ack did — nb cycles away from the read
    # stream (whichever burst won the channel first).
    if len(cycles['R']) != nb:
        return False, (f'Expected {nb} read beats; got {len(cycles["R"])}')
    if len(cycles['W']) != 1:
        return False, (f'Expected a single write burst ack; got '
                       f'{len(cycles["W"])} ({cycles["W"]})')
    r_span = cycles['R'][-1] - cycles['R'][0] + 1
    if r_span != nb:
        return False, (f'Expected {nb}-cycle contiguous read stream; got '
                       f'{r_span} cycles ({cycles["R"][0]}..{cycles["R"][-1]})')
    w = cycles['W'][0]
    # Serialised: the ack is nb cycles after the read stream's last beat
    # (write lost the channel) or the read stream starts nb cycles after the
    # cycle the write's last per-beat ack would have landed (write won).
    ok_w_lost = (w == cycles['R'][-1] + nb)
    ok_w_won = (cycles['R'][0] == w + 1)
    if not (ok_w_lost or ok_w_won):
        return False, (f'Write ack at {w} not serialised against read stream '
                       f'{cycles["R"][0]}..{cycles["R"][-1]} (expected '
                       f'{cycles["R"][-1] + nb} or read start at {w + 1})')
    return True, (f'read stream {cycles["R"][0]}..{cycles["R"][-1]} and write '
                  f'ack at {w} — shared channel serialises the bursts')


def _check_single_write_ack(test, output, *args, **kwargs):
    """Assert the master saw exactly ONE write RESP (the burst ack) and all
    beats were granted (non-last beats produce no response)."""
    import re
    acks = []
    grants = 0
    for line in output.splitlines():
        if re.search(r'master GRANTED name=W#', line):
            grants += 1
        m = re.search(r'^\[(\d+)\] master RESP name=W#\d+ .*last=1 status=0', line)
        if m:
            acks.append(int(m.group(1)))
    if grants != 4:
        return False, f'Expected 4 granted write beats, got {grants}'
    if len(acks) != 1:
        return False, f'Expected exactly 1 write burst ack, got {len(acks)} ({acks})'
    return True, f'4 beats granted, single burst ack at cycle {acks[0]}'
