from gvtest.testsuite import *

import re

RESP_RX = re.compile(r'^\[(\d+)\] master RESP .*first=(\d) last=(\d)', re.MULTILINE)
QUIT_RX = re.compile(r'^\[\d+\] master QUIT', re.MULTILINE)
DENY_RX = re.compile(r'^\[\d+\] master DENY ', re.MULTILINE)
RETRY_RX = re.compile(r'^\[\d+\] master RETRY', re.MULTILINE)


def _make_check(expected_beats):
    """Assert the run finished (no assert abort) and the master observed exactly
    `expected_beats` resp() beats, with is_first on the first and is_last on the
    last. The C++ traces.assert checks (asserts-mode) police the rest."""
    def _check(test, output, *args, **kwargs):
        if not QUIT_RX.search(output):
            return False, 'no master QUIT line (sim aborted, hung, or assert fired)'
        beats = RESP_RX.findall(output)
        if len(beats) != expected_beats:
            return False, f'got {len(beats)} resp beats, expected {expected_beats}'
        if beats[0][1] != '1':
            return False, 'first beat does not have is_first=1'
        if beats[-1][2] != '1':
            return False, 'last beat does not have is_last=1'
        return True, f'{expected_beats} beats, first/last ok'
    return _check


def _make_bp_check(expected_beats, expected_denies):
    """Like _make_check, but also assert the response-path back-pressure handshake
    actually fired: exactly `expected_denies` DENY beats, each matched by a RETRY,
    while the master still ends up observing all `expected_beats` accepted beats
    (the adapter held and re-sent the exact denied beat)."""
    base = _make_check(expected_beats)
    def _check(test, output, *args, **kwargs):
        ok, msg = base(test, output, *args, **kwargs)
        if not ok:
            return ok, msg
        denies = len(DENY_RX.findall(output))
        retries = len(RETRY_RX.findall(output))
        if denies != expected_denies:
            return False, f'got {denies} denied beats, expected {expected_denies}'
        if retries != expected_denies:
            return False, f'got {retries} resp_retry() calls, expected {expected_denies}'
        return True, f'{msg}; {denies} deny/retry handshakes'
    return _check


def _make_spread_check(expected_beats, window):
    """Assert the read beats are paced across the burst's bandwidth window:
    exactly `expected_beats` beats, the last landing `window` cycles after the
    first (= (beats-1) x the per-beat duration), each gap >= 1 and even (each
    beat spaced by its own bandwidth occupancy, NOT bunched one per cycle)."""
    base = _make_check(expected_beats)
    def _check(test, output, *args, **kwargs):
        ok, msg = base(test, output, *args, **kwargs)
        if not ok:
            return ok, msg
        cycles = [int(c) for c, _, _ in RESP_RX.findall(output)]
        span = cycles[-1] - cycles[0]
        if span != window:
            return False, (f'beats span {span} cycles, expected {window} '
                           f'(first={cycles[0]}, last={cycles[-1]})')
        gaps = [cycles[i + 1] - cycles[i] for i in range(len(cycles) - 1)]
        if any(g < 1 for g in gaps):
            return False, f'non-monotonic beats: gaps={gaps}'
        step = window / (expected_beats - 1) if expected_beats > 1 else 0
        if any(abs(g - step) > 1 for g in gaps):
            return False, f'beats not evenly spread: gaps={gaps} (~{step:.1f} expected)'
        return True, f'{expected_beats} beats spread over {window} cyc, gaps={gaps}'
    return _check


def _make_cycles_check(expected_offsets):
    """Assert the read beats land at exactly these cycles, relative to the
    first one."""
    base = _make_check(len(expected_offsets))
    def _check(test, output, *args, **kwargs):
        ok, msg = base(test, output, *args, **kwargs)
        if not ok:
            return ok, msg
        cycles = [int(c) for c, _, _ in RESP_RX.findall(output)]
        offsets = [c - cycles[0] for c in cycles]
        if offsets != expected_offsets:
            return False, f'beats at {offsets}, expected {expected_offsets}'
        return True, f'beats at {offsets}'
    return _check


def testset_build(testset):
    testset.set_name('io_v2_beat_to_sync_adapter')
    testset.set_components(["utils.io_v2_beat_to_sync_adapter"])

    def add(name, beats, desc):
        t = testset.new_make_test(name, flags=f'CASE={name}',
                                  checker=_make_check(beats),
                                  build_resource='gvsoc.core.build', no_clean=True)
        t.add_description(desc)

    def add_bp(name, beats, denies, desc):
        t = testset.new_make_test(name, flags=f'CASE={name}',
                                  checker=_make_bp_check(beats, denies),
                                  build_resource='gvsoc.core.build', no_clean=True)
        t.add_description(desc)

    def add_spread(name, beats, window, desc):
        t = testset.new_make_test(name, flags=f'CASE={name}',
                                  checker=_make_spread_check(beats, window),
                                  build_resource='gvsoc.core.build', no_clean=True)
        t.add_description(desc)

    add('r1', 1,
        "Single-beat read (size == beat_width): one resp beat, round-tripping "
        "the master's own descriptor.")
    add('r_multi', 4,
        "32 B read at beat_width 8: four resp beats, each a distinct "
        "adapter-allocated object, paced one per cycle, in-order is_first/is_last.")
    add('w1', 1,
        "Single-beat write: exactly one data-less per-burst ack.")
    add('w_multi', 1,
        "32 B write submitted as four allocator-backed beats: the adapter "
        "consumes/frees each beat inline and emits exactly ONE data-less "
        "burst ack (per-burst write-ack contract), on the cycle the old last "
        "per-beat ack fired.")
    add_spread('lat_dur', 4, 18,
        "Read with target latency=2 + duration=6/beat over four beats: the head "
        "beat lands at the head latency, each following beat 6 cycles (its own "
        "bandwidth occupancy) after the previous — last at head+18, not 1/cycle.")
    add_spread('spread', 8, 14,
        "64 B read, target duration=2/beat over eight beats: one beat every 2 "
        "cycles (each beat's own occupancy), last at head+14 — the per-beat "
        "pacing, each beat read from the slave at its own delivery cycle.")
    def add_cycles(name, offsets, desc):
        t = testset.new_make_test(name, flags=f'CASE={name}',
                                  checker=_make_cycles_check(offsets),
                                  build_resource='gvsoc.core.build', no_clean=True)
        t.add_description(desc)

    add_cycles('overlap', [0, 1, 2, 3, 4, 5],
        "Two reads, latency=10, the second submitted 2 cycles after the first: "
        "its latency overlaps the first one's, so its beats follow at once.")
    add_cycles('overlap_late', [0, 1, 2, 3, 11, 12],
        "Two reads, latency=10, the second submitted while the first streams: "
        "it still pays its own latency, counted from its submission.")
    add('err', 2,
        "Sync slave reports IO_RESP_INVALID: every beat of the 16 B read carries "
        "the error status.")
    add('zero', 1,
        "Degenerate zero-size read: exactly one is_first=is_last zero-size beat.")

    add_bp('bp_read', 4, 2,
        "32 B read with two middle beats back-pressured: the master returns "
        "IO_RESP_DENIED, the adapter holds the exact beat and re-sends it on "
        "resp_retry(); all four beats are still observed in order.")
    add_bp('bp_write', 1, 1,
        "32 B write with its single burst ack back-pressured once: deny + "
        "resp_retry() on the data-less ack, which the adapter holds and "
        "re-sends.")
    add_bp('bp_last', 1, 1,
        "Single-beat read with the only (is_last) beat back-pressured: the "
        "adapter holds and re-sends the master's own descriptor.")
    add_bp('bp_all', 4, 4,
        "32 B read (latency=2,duration=6) with every beat back-pressured once: "
        "repeated hold/retry, including a deny right after a previous re-send.")
